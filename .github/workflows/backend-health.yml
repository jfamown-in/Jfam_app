name: JFAM Backend Keepalive Health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jfam-backend-health
  cancel-in-progress: false

jobs:
  backend-health:
    name: Hourly read-only Supabase keepalive and availability check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run read-only backend health check
        env:
          JFAM_SUPABASE_URL: ${{ vars.JFAM_SUPABASE_URL }}
          JFAM_SUPABASE_ANON_KEY: ${{ secrets.JFAM_SUPABASE_ANON_KEY }}
          JFAM_REQUIRED_RPCS: backend_healthcheck
          # Comma-separate deployed Edge Function names here after Razorpay functions exist.
          # Use '-' to keep the first keepalive pass focused on Auth, REST, and RPC.
          JFAM_EDGE_FUNCTIONS: '-'
        run: node scripts/backend-healthcheck.mjs
